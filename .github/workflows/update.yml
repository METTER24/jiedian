name: Auto Node Pool


on:

  schedule:

    # 每30分钟运行
    - cron: "*/30 * * * *"


  workflow_dispatch:


jobs:


 update:


  runs-on:
    ubuntu-latest


  permissions:

    contents:
      write


  steps:


  - name:
      Checkout

    uses:
      actions/checkout@v4



  - name:
      Setup Python

    uses:
      actions/setup-python@v5

    with:

      python-version:
        "3.12"



  - name:
      Install

    run:

      pip install -r requirements.txt



  - name:
      Download nodes

    run:

      python scripts/fetch.py



  - name:
      Filter nodes

    run:

      python scripts/filter.py



  - name:
      Generate

    run:

      python scripts/generate.py



  - name:
      Save

    run:


      git config user.name github-actions

      git config user.email github-actions@github.com


      git add .


      git commit -m "auto update" || exit 0


      git push
