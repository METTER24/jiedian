name: Update Nodes


on:

  schedule:

    # 每6小时更新

    - cron: "0 */6 * * *"


  workflow_dispatch:



jobs:

  build:


    runs-on:

      ubuntu-latest


    steps:


    - name: 下载代码

      uses:

        actions/checkout@v4



    - name: 安装Python

      uses:

        actions/setup-python@v5

      with:

        python-version: "3.x"



    - name: 安装依赖

      run:

        pip install requests



    - name: 抓取节点

      run:

        python collector.py



    - name: 保存更新


      run: |


        git config user.name github-actions

        git config user.email github-actions@github.com


        git add .


        git commit -m "auto update" || exit 0


        git push
