name: Update Nodes


on:

  schedule:

    # 每30分钟运行一次

    - cron: "*/30 * * * *"


  workflow_dispatch:



jobs:


  build:


    permissions:

      contents: write



    runs-on:

      ubuntu-latest



    steps:


      - name: 下载代码

        uses: actions/checkout@v4



      - name: 安装Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"



      - name: 安装依赖

        run: |

          pip install requests



      - name: 抓取节点

        run: |

          python collector.py



      - name: 保存更新

        run: |


          git config user.name github-actions


          git config user.email github-actions@github.com


          git add .


          git commit -m "auto update nodes" || exit 0


          git push
