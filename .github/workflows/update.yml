name: Auto Node Pool


on:

  schedule:

    # 每30分钟自动运行
    - cron: "*/30 * * * *"


  workflow_dispatch:



permissions:

  contents: write



jobs:


  update:


    runs-on: ubuntu-latest



    steps:


      # ==========================
      # 拉取仓库
      # ==========================

      - name: Checkout

        uses: actions/checkout@v4




      # ==========================
      # Python环境
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"




      # ==========================
      # 安装Python依赖
      # ==========================

      - name: Install dependencies

        run: |

          pip install requests pysocks




      # ==========================
      # 安装 sing-box
      # ==========================

      - name: Install sing-box

        run: |

          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.11.8/sing-box-1.11.8-linux-amd64.tar.gz

          tar -xf sing-box-1.11.8-linux-amd64.tar.gz

          sudo mv sing-box-1.11.8-linux-amd64/sing-box /usr/local/bin/sing-box

          sing-box version





      # ==========================
      # 抓取节点
      # ==========================

      - name: Collect nodes

        run: |

          python collector.py





      # ==========================
      # TCP初筛
      # ==========================

      - name: Check nodes

        run: |

          python checker.py





      # ==========================
      # 真实代理测速
      # ==========================

      - name: Real proxy test

        run: |

          python speedtest.py





      # ==========================
      # 生成V2RayN订阅
      # ==========================

      - name: Generate subscription

        run: |

          python generator.py





      # ==========================
      # 检查结果
      # ==========================

      - name: Show result

        run: |

          echo "========== 文件 =========="

          ls -lh


          echo ""

          echo "========== 数量 =========="


          echo "全部节点:"
          wc -l nodes.txt || true


          echo "TCP存活:"
          wc -l alive_nodes.txt || true


          echo "真实可用:"
          wc -l best_nodes.txt || true


          echo "订阅:"
          wc -l sub.txt || true





      # ==========================
      # 提交更新
      # ==========================

      - name: Save update

        run: |


          git config user.name "github-actions[bot]"


          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add nodes.txt alive_nodes.txt best_nodes.txt sub.txt hk.txt tw.txt us.txt



          git commit -m "auto update nodes" || exit 0



          git pull --rebase origin main



          git push origin HEAD:main
