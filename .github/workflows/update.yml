name: Auto Node Pool

on:

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:


jobs:

  update:

    runs-on: ubuntu-latest


    permissions:

      contents: write


    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install dependencies

        run:

          pip install requests



      - name: Collect nodes

        run:

          python collector.py



      - name: Save update

        run:

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add .

          git commit -m "auto update nodes" || exit 0

          git pull --rebase

          git push
